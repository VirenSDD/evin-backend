# The game catalog, which the API cannot create.

encuentra_las_parejas:
  nombre: Encuentra las parejas
  descripcion: Visual memory exercise that pairs cards with the same symbol.
  img: img/juegos/memoria.png
  nivel: Fácil
  tipo: Memoria visual

recuerda_las_casillas:
  nombre: Recuerda las casillas
  descripcion: Reproduce from memory a pattern of highlighted squares.
  img: img/juegos/grid.png
  nivel: Medio
  tipo: Atención visual

exploraciones:
  nombre: Exploraciones
  descripcion: Find a target stimulus among distracting images.
  img: img/juegos/radar.png
  nivel: Difícil
  tipo: Atención visual

encuentra_las_diferencias:
  nombre: Encuentra las diferencias
  descripcion: Spot every difference between two almost identical images.
  img: img/juegos/diferencias.png
  nivel: Medio
  tipo: Atención visual

cierre_visual:
  nombre: Cierre visual
  descripcion: Match an incomplete shape with the complete one.
  img: img/juegos/rasgos.png
  nivel: Medio
  tipo: Atención visual

puzzle:
  nombre: Puzzle
  descripcion: Rebuild the picture by placing every piece in its position.
  img: img/juegos/puzzle.png
  nivel: Medio
  tipo: Percepción espacial
